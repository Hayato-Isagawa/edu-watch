# Purge the Cloudflare edge cache after a deployment goes live.
#
# Why: HTML pages on news.edu-evidence.org are edge-cached via a Cache Rule
# (Edge TTL 10 min). A deploy does NOT purge a zone-level Cache Rule cache, so
# without this a content fix could be served stale until the Edge TTL expires.
# This waits for the pushed commit's production build to finish, then purges the
# zone so the corrected HTML is served immediately.
#
# The site moved from Cloudflare Pages to Workers static assets, so this now
# polls Workers Builds instead of the Pages deployments API. Workers Builds is
# keyed by the worker's script tag, not its name, so the tag is looked up first.
#
# Note: the three sister sites (edu-evidence.org / law.* / news.*) share one
# Cloudflare zone, and the Free plan can only purge_everything (no per-hostname
# purge). So this purge also clears the other two sites' edge cache. That is
# safe (over-purging never serves stale content); the others simply re-warm.
#
# Required repository secrets (same values as the edu-evidence repo — same
# account and shared zone):
#   CLOUDFLARE_API_TOKEN  - token scoped to this zone with
#                           Account > Workers Scripts: Read
#                           and  Zone > Cache Purge: Edit
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare account id
#   CLOUDFLARE_ZONE_ID    - the shared edu-evidence.org zone id
#
# The token previously needed "Cloudflare Pages: Read" instead; it was re-scoped
# on 2026-08-05. The fallback below stays anyway: if the lookup ever fails (a
# rotated or mis-scoped token), the job waits a fixed interval and purges rather
# than erroring — the cache still gets purged, just less precisely.
name: Purge Cloudflare cache on deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A later push's purge supersedes an in-flight one (purge is zone-wide).
  group: cf-purge
  cancel-in-progress: true

jobs:
  purge:
    name: Wait for the Workers deploy, then purge cache
    runs-on: ubuntu-latest
    # 内部で Workers Builds の完了を最大 10 分ポーリングし(seq 1 40 × sleep 15)、
    # script tag を解決できないときは固定で 3 分待つ。20 分はその上限の約 2 倍。
    # (実測の最大は Workers 移行後で 3.4 分)
    timeout-minutes: 20
    steps:
      - name: Purge after deployment is live
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          WORKER_NAME: edu-watch
        run: |
          set -euo pipefail

          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ACCOUNT_ID}" ] || [ -z "${CF_ZONE_ID}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_ZONE_ID secret"
            exit 1
          fi

          sha="${GITHUB_SHA}"
          api="https://api.cloudflare.com/client/v4"

          # Workers Builds is addressed by script tag, so resolve it from the name.
          tag=$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "${api}/accounts/${CF_ACCOUNT_ID}/workers/services/${WORKER_NAME}" 2>/dev/null \
            | jq -r '.result.default_environment.script.tag // empty' 2>/dev/null || echo "")

          if [ -z "${tag}" ]; then
            # Most likely the API token still carries the old Pages scope.
            echo "::warning::Could not resolve the script tag for ${WORKER_NAME}; the token may lack Account > Workers Scripts: Read. Waiting a fixed 3 min instead."
            sleep 180
          else
            live=0
            # Poll Workers Builds until this commit's production build finishes
            # (max ~10 min). Preview builds run on other branches, so the branch
            # is matched too.
            for i in $(seq 1 40); do
              outcome=$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" \
                "${api}/accounts/${CF_ACCOUNT_ID}/builds/workers/${tag}/builds?per_page=20" 2>/dev/null \
                | jq -r --arg sha "$sha" \
                  'first(.result[]? | select(.build_trigger_metadata.commit_hash == $sha and .build_trigger_metadata.branch == "main") | .build_outcome) // "pending"' \
                2>/dev/null || echo "pending")
              echo "attempt ${i}: build outcome = ${outcome}"
              case "${outcome}" in
                success) live=1; break ;;
                fail|failure|cancelled|canceled) echo "build did not succeed (${outcome}); skipping purge"; exit 0 ;;
                *) sleep 15 ;;
              esac
            done

            if [ "${live}" -ne 1 ]; then
              echo "::warning::Timed out waiting for the build of ${sha}; skipping purge"
              exit 0
            fi
          fi

          echo "Deployment live; purging zone cache"
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${api}/zones/${CF_ZONE_ID}/purge_cache" \
            --data '{"purge_everything":true}')
          echo "${resp}" | jq -e '.success == true' >/dev/null \
            || { echo "::error::Purge failed: ${resp}"; exit 1; }
          echo "Cache purged."
