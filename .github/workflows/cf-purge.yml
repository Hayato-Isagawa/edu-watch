# Purge the Cloudflare edge cache after a deployment goes live.
#
# Why: HTML pages on news.edu-evidence.org are edge-cached via a Cache Rule
# (Edge TTL 10 min). A deploy does NOT purge a zone-level Cache Rule cache, so
# without this a content fix could be served stale until the Edge TTL expires.
# This waits for the pushed commit's production build to finish, then purges the
# zone so the corrected HTML is served immediately.
#
# The site moved from Cloudflare Pages to Workers static assets, so this now
# polls Workers Builds instead of the Pages deployments API. Workers Builds is
# keyed by the worker's script tag, not its name, so the tag is looked up first.
#
# Note: the three sister sites (edu-evidence.org / law.* / news.*) share one
# Cloudflare zone, and the Free plan can only purge_everything (no per-hostname
# purge). So this purge also clears the other two sites' edge cache. That is
# safe (over-purging never serves stale content); the others simply re-warm.
#
# Required repository secrets (same values as the edu-evidence repo — same
# account and shared zone):
#   CLOUDFLARE_API_TOKEN  - token scoped to this zone with
#                           Account > Workers Scripts: Read
#                           and  Zone > Cache Purge: Edit
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare account id
#   CLOUDFLARE_ZONE_ID    - the shared edu-evidence.org zone id
#
# If the build cannot be checked (the tag lookup or the builds API keeps
# failing, e.g. a rotated or mis-scoped token), the job still purges after a
# fixed wait, then fails so the cause gets fixed (ADR 0081).
name: Purge Cloudflare cache on deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A later push's purge supersedes an in-flight one (purge is zone-wide).
  group: cf-purge
  cancel-in-progress: true

jobs:
  purge:
    name: Wait for the Workers deploy, then purge cache
    runs-on: ubuntu-latest
    # 待ちは経過時間で打ち切る(ADR 0081)。自分のビルドに OWN_BUILD_SECONDS、
    # 置き換えた新しいビルドを追う分を含めて全体で TOTAL_SECONDS。期限の判定は
    # API を呼ぶ前なので、最後の 1 回の待ち(最長 MAX_RETRY_AFTER)と curl 2 回分
    # (CURL_MAX_TIME × 2)だけ期限を越えうる。55 分はその合計に余裕を足した値。
    timeout-minutes: 55
    steps:
      - name: Purge after deployment is live
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          WORKER_NAME: edu-watch
          # 自分のビルドを待つ上限。成功までに約 12.5 分・約 20 分かかったビルドが
          # あり(2026-09-30 / 2026-10-21)、10 分では purge に届かなかった(ADR 0080)。
          OWN_BUILD_SECONDS: "1500"
          # skipped の後に新しいビルドを追う分も含めた上限。push から置き換えた
          # ビルドが終わるまでの実測の最長は約 32 分(skipped のビルドの作成時刻から
          # 数えた。main の skipped 全 61 件、2026-10-26)。
          TOTAL_SECONDS: "2700"
          POLL_INTERVAL: "15"
          FALLBACK_WAIT: "180"
          CURL_MAX_TIME: "20"
          MAX_API_ERRORS: "5"
          MAX_RETRY_AFTER: "300"
          PER_PAGE: "50"
        run: |
          set -euo pipefail

          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ACCOUNT_ID}" ] || [ -z "${CF_ZONE_ID}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_ZONE_ID secret"
            exit 1
          fi

          sha="${GITHUB_SHA}"
          api="https://api.cloudflare.com/client/v4"
          body_file="$(mktemp)"
          hdr_file="$(mktemp)"
          api_errors=0
          rate_limited=0

          now() { date +%s; }
          start=$(now)
          own_deadline=$((start + OWN_BUILD_SECONDS))
          total_deadline=$((start + TOTAL_SECONDS))

          snippet() { head -c 500 "${body_file}" | tr '\n' ' '; }

          purge() {
            local resp
            resp=$(curl -sS --max-time "${CURL_MAX_TIME}" -X POST \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${api}/zones/${CF_ZONE_ID}/purge_cache" \
              --data '{"purge_everything":true}') || resp="curl exited $?"
            if ! jq -e '.success == true' >/dev/null 2>&1 <<<"${resp}"; then
              echo "::error::Purge failed: ${resp}"
              exit 1
            fi
            echo "Cache purged."
          }

          # The build cannot be checked. Purge anyway so the cache is cleared,
          # then fail so the cause (usually the token) gets fixed.
          fallback() {
            local wait
            echo "::error::$1 The build could not be checked; purging after a fixed wait, then failing."
            wait=$((start + FALLBACK_WAIT - $(now)))
            if [ "${wait}" -gt 0 ]; then sleep "${wait}"; fi
            purge
            exit 1
          }

          # A failure that may clear up: count it, give up after MAX_API_ERRORS
          # in a row, otherwise wait one interval.
          transient() {
            api_errors=$((api_errors + 1))
            echo "::warning::$1 (${api_errors}/${MAX_API_ERRORS} in a row)"
            if [ "${api_errors}" -ge "${MAX_API_ERRORS}" ]; then
              fallback "Cloudflare API failed ${api_errors} times in a row. Last: $1"
            fi
            sleep "${POLL_INTERVAL}"
          }

          # GET a Cloudflare API URL into body_file. Returns 0 on success and 1
          # when the caller should try again (this function has already waited).
          #   429                 -> wait Retry-After (at least POLL_INTERVAL, capped),
          #                          not counted; still limited at the deadline -> fallback
          #   5xx / curl failure / success != true -> transient (counted)
          #   any other status    -> fallback (401 / 403 / 404 do not heal)
          cf_get() {
            local code ra
            rate_limited=0
            : > "${body_file}"
            : > "${hdr_file}"
            code=$(curl -sS --max-time "${CURL_MAX_TIME}" -o "${body_file}" -D "${hdr_file}" \
              -w '%{http_code}' -H "Authorization: Bearer ${CF_API_TOKEN}" "$1") || code="000"
            case "${code}" in
              2??)
                if jq -e '.success == true' "${body_file}" >/dev/null 2>&1; then
                  return 0
                fi ;;
              429)
                ra=$(tr -d '\r' < "${hdr_file}" | awk -F': *' 'tolower($1) == "retry-after" { v = $2 } END { print v }')
                case "${ra}" in ''|*[!0-9]*) ra="${POLL_INTERVAL}" ;; esac
                if [ "${ra}" -lt "${POLL_INTERVAL}" ]; then ra="${POLL_INTERVAL}"; fi
                if [ "${ra}" -gt "${MAX_RETRY_AFTER}" ]; then ra="${MAX_RETRY_AFTER}"; fi
                rate_limited=1
                echo "Rate limited by the Cloudflare API; waiting ${ra}s"
                sleep "${ra}"
                return 1 ;;
              000|5??) ;;
              *)
                fallback "Cloudflare API returned HTTP ${code}: $(snippet)" ;;
            esac
            transient "Cloudflare API call failed (HTTP ${code}): $(snippet)"
            return 1
          }

          # Workers Builds is addressed by script tag, so resolve it from the name.
          tag=""
          until cf_get "${api}/accounts/${CF_ACCOUNT_ID}/workers/services/${WORKER_NAME}"; do
            if [ "$(now)" -ge "${own_deadline}" ]; then
              fallback "Timed out looking up the script tag for ${WORKER_NAME}."
            fi
          done
          tag=$(jq -r '.result.default_environment.script.tag // empty' "${body_file}")
          if [ -z "${tag}" ]; then
            fallback "Could not resolve the script tag for ${WORKER_NAME}; the token may lack Account > Workers Scripts: Read."
          fi
          api_errors=0

          # build_outcome is null until the build stops, and then one of
          # success / fail / skipped / cancelled / terminated (Cloudflare API
          # schema, builds_BuildOutcome). The list has no sort parameter, so
          # builds are ordered by created_on here. Preview builds run on other
          # branches, so the branch is matched too.
          #   - fail / terminated (and unknown values): production does not serve
          #     this commit, so fail the job to make it visible. A terminated
          #     build gets no check-run on the commit (2026-10-23, ADR 0080).
          #   - skipped / cancelled: this build put nothing live. skipped means a
          #     newer queued build with the same trigger superseded it (Workers
          #     Builds does this since 2026-07-24). That newer commit may have no
          #     run of this workflow at all (merges made with GITHUB_TOKEN, e.g.
          #     Dependabot's, trigger no push workflows), so follow the newest
          #     build that came after this one and purge when it succeeds. If no
          #     newer build is listed (e.g. cancelled by hand), skip the purge.
          # failure / canceled are the spellings Workers Builds event
          # subscriptions use; kept in case the REST API ever returns them.
          builds_url="${api}/accounts/${CF_ACCOUNT_ID}/builds/workers/${tag}/builds?per_page=${PER_PAGE}"
          defs='def ts: (capture("^(?<s>[^.]+?)(?<f>\\.[0-9]+)?Z$") // error("unexpected created_on: \(.)")) | (.s + "Z" | fromdateiso8601) + (("0" + (.f // "")) | tonumber);
                def row: "\(.build_outcome // "pending") \(.created_on) \(.trigger.trigger_uuid // "-") \(.build_trigger_metadata.commit_hash)";'
          own_filter='[.result[]? | select(.build_trigger_metadata.commit_hash == $sha and .build_trigger_metadata.branch == "main")]
                | sort_by(.created_on | ts) | last | if . == null then "pending - - -" else row end'
          newer_filter='[.result[]? | select(.build_trigger_metadata.branch == "main"
                  and ($trig == "-" or .trigger.trigger_uuid == $trig)
                  and (.created_on | ts) > ($created | ts))]
                | sort_by(.created_on | ts) | last | if . == null then "none - - -" else row end'

          phase=own
          created="-"
          trig="-"
          attempt=0
          while :; do
            deadline="${own_deadline}"
            if [ "${phase}" = follow ]; then deadline="${total_deadline}"; fi
            if [ "$(now)" -ge "${deadline}" ]; then
              if [ "${rate_limited}" = 1 ]; then
                fallback "Rate limited by the Cloudflare API until the deadline."
              fi
              if [ "${phase}" = own ]; then
                echo "::error::Timed out waiting for the build of ${sha}; skipping purge"
              else
                echo "::error::Timed out waiting for the build that superseded ${sha}; skipping purge"
              fi
              exit 1
            fi
            cf_get "${builds_url}" || continue
            attempt=$((attempt + 1))
            if [ "${phase}" = own ]; then
              line=$(jq -r --arg sha "${sha}" "${defs} ${own_filter}" "${body_file}") || line=""
            else
              line=$(jq -r --arg trig "${trig}" --arg created "${created}" "${defs} ${newer_filter}" "${body_file}") || line=""
            fi
            if [ -z "${line}" ]; then
              transient "Could not read the builds list: $(snippet)"
              continue
            fi
            api_errors=0
            read -r outcome b_created b_trig b_sha <<<"${line}"
            echo "attempt ${attempt} (${phase}): build outcome = ${outcome}${b_sha:+ (${b_sha})}"
            case "${outcome}" in
              success)
                break ;;
              pending)
                sleep "${POLL_INTERVAL}" ;;
              none)
                echo "No newer build superseded ${sha}; nothing new went live, skipping purge"
                exit 0 ;;
              cancelled|canceled|skipped)
                if [ "${phase}" = follow ]; then
                  echo "The newer build ${b_sha} was ${outcome}; nothing new went live, skipping purge"
                  exit 0
                fi
                echo "Build of ${sha} was ${outcome}; following the newer build that superseded it"
                phase=follow
                created="${b_created}"
                trig="${b_trig}" ;;
              fail|failure|terminated)
                echo "::error::Workers build ${b_sha} ended as ${outcome}; production does not serve ${sha}. Skipping purge."
                exit 1 ;;
              *)
                echo "::error::Unknown build outcome '${outcome}' for ${b_sha}; skipping purge. Check Workers Builds and update this list."
                exit 1 ;;
            esac
          done

          echo "Deployment live; purging zone cache"
          purge
