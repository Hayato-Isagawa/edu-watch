name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

# 同じ PR の run を直列化する。opened と synchronize が重なると、両方が既存コメントを
# 読んでから投稿し、同じ保留コメントが 2 件付く。
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # 作成者は user.login で見る。github.actor は最後に動いた者で、作成者ではない(zizmor の
    # bot-conditions)。head が別リポの PR は対象にしない。actor も Dependabot に限るのは、
    # 人が push した後の run では動かないようにするため(作成者の判定には使っていない)。
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name && github.actor == 'dependabot[bot]' # zizmor: ignore[bot-conditions] actor は作成者の判定でなく、人の push 後の run を外すために残している
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 自動マージするかどうかを決める(ADR 0041 / 0078)。人が見るのは次のどれか:
      #   - major 更新、または update-type・updated-dependencies-json を読めなかった更新
      #   - 本番依存(direct:production)の 0.x の minor 更新。0.x では minor が
      #     破壊的変更を含みうる(satori 0.42.0 の box-sizing の既定変更は、#867 で
      #     0.33.5 → 0.56.1 の minor として自動マージされ、OG 画像を全号で崩した)
      #   - 本番依存のバージョンを読めない更新
      # dependencyType が direct:development / indirect と明示されたもの以外は本番依存として扱う。
      #
      # previous-version / new-version の出力は先頭の依存 1 件分しか持たないので、
      # グループ化された PR の 2 件目以降も見るために updated-dependencies-json を読む。
      # 人が見る場合は理由を PR にコメントする。ci-summary.yml は Dependabot の PR に
      # 完了通知を出さない(2026-10-19 時点)ので、同じく @メンションを付けて直接の通知にする。
      # pull_request は synchronize でも走るので、同じ理由のコメントは 1 PR に 1 度だけ付ける。
      # 照合するのはこの workflow(github-actions[bot])のコメントだけ。公開リポなので、
      # 誰かが印を先に書けば保留の通知を止められてしまう。
      - name: Enable auto-merge, or explain why not
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          reasons=""
          add() { reasons="${reasons}- $1"$'\n'; }

          case "$UPDATE_TYPE" in
            version-update:semver-major) add "major 更新" ;;
            version-update:semver-minor | version-update:semver-patch) ;;
            *) add "update-type を判定できなかった(\`${UPDATE_TYPE}\`)" ;;
          esac

          # -s で入力全体を配列に包む。空文字だと jq は何も出力せず exit 0 になり、
          # 「理由なし = 自動マージ」に倒れるので、値がちょうど 1 つあることを先に見る。
          filter='
            if length != 1 then
              "updated-dependencies-json が空か、JSON の値が 1 つでない"
            elif (.[0] | type) != "array" or (.[0] | length) == 0 then
              "updated-dependencies-json が空か、配列でない"
            else
              .[0][]
              | select(((.dependencyType // "") | IN("direct:development", "indirect")) | not)
              | (.prevVersion // "" | tostring | ltrimstr("v")) as $p
              | (.newVersion // "" | tostring | ltrimstr("v")) as $n
              | if ($p | test("^[0-9]") | not) or ($n | test("^[0-9]") | not) then
                  "\(.dependencyName // "?"): バージョンを読めない(`\(.prevVersion // "")` → `\(.newVersion // "")`)"
                elif ($p | split(".")[0]) == "0"
                  and ((($n | split(".")[0]) != "0") or (($n | split(".")[1]) != ($p | split(".")[1]))) then
                  "\(.dependencyName): 0.x の本番依存の minor 更新(\($p) → \($n))"
                else empty end
            end'
          if found=$(printf '%s' "$DEPS_JSON" | jq -rs "$filter" 2>/dev/null); then
            while IFS= read -r line; do
              [ -n "$line" ] && add "$line"
            done <<< "$found"
          else
            add "updated-dependencies-json を読めなかった"
          fi

          if [ -z "$reasons" ]; then
            gh pr merge --auto --squash --delete-branch "$PR_URL"
            exit 0
          fi

          printf '自動マージしなかった:\n%s' "$reasons"

          # 一度変数に受け、パイプを使わずに探す(理由は ci-summary.yml の同じ箇所)。
          # 鍵を理由ごとに変えるので、同じ PR でも理由が変われば改めて通知する。
          marker="<!-- dependabot-auto-merge: hold $(printf '%s' "$reasons" | cksum | tr ' ' '-') -->"
          comments=$(gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
          if [[ "$comments" == *"$marker"* ]]; then
            echo "already commented on #${PR_NUMBER} with the same reasons"
            exit 0
          fi

          body="$(printf '@Hayato-Isagawa 自動マージの対象外なので、人がレビューしてマージしてください(ADR 0078)。\n\n%s\n%s' "$reasons" "$marker")"
          gh pr comment "$PR_URL" --body "$body"
