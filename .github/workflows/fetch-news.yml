name: Fetch news

on:
  schedule:
    # JST 07:00 = UTC 22:00 (-1d)(設計書 §6.1、ADR 0009)
    - cron: "0 22 * * *"
    # JST 19:30 = UTC 10:30(ADR 0043: ピーク帯 + on-the-hour 殺到回避のため JST 18:00 → 19:30 に微調整)
    - cron: "30 10 * * *"
  workflow_dispatch:

# 同時実行を抑止(cron と workflow_dispatch が重なっても 1 本だけ走る)
concurrency:
  group: fetch-news
  cancel-in-progress: false

# 収集(npm の依存を実行する)と publish(PAT で push する)を別 job に分ける(ADR 0079)。
# 同じ job に置くと、依存のコードが persist された PAT を読めるうえ、後続の step に
# 仕掛け(.git/hooks・$GITHUB_PATH)を残せる。publish は依存を入れない。
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".tool-versions"
          cache: npm
      - run: npm ci
      - name: Run fetch-news
        run: npx tsx scripts/fetch-news.ts
      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- src/data/articles/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "[fetch-news] no new articles, skipping PR"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # 隠しファイル(.gitkeep)は既定で入らない。publish は上書きで展開するので消えない。
      # fetch-news.ts はファイルを足すか書き換えるだけで、消さない。
      - name: Upload articles
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: articles
          path: src/data/articles/
          retention-days: 1

  publish:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # ボット用 feature ブランチへの push に必要
      pull-requests: write  # PR 作成 + auto-merge enable に必要
      issues: write         # `gh label create` は labels API(issues スコープ)を使う
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.AUTO_COLLECT_PAT }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: articles
          path: src/data/articles/
      - name: Commit, push branch, and open auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.AUTO_COLLECT_PAT }}
        run: |
          git config user.name "edu-watch-bot"
          git config user.email "notify@edu-evidence.org"
          git add src/data/articles/
          if git diff --cached --quiet; then
            echo "[fetch-news] no new articles, skipping PR"
            exit 0
          fi
          timestamp=$(date -u +%Y%m%d-%H%M)
          branch="chore/auto-collect-${timestamp}"
          git checkout -b "$branch"
          git commit -m "chore(data): auto-collect articles ${timestamp}"
          git push -u origin "$branch"
          # `auto-collect` ラベルが未作成のリポジトリでも壊れないよう冪等に作る。
          # 既存なら --force で上書き(色 / 説明が違っても揃える)、それでも失敗
          # した場合は無視して PR 作成側で続行する(--label 指定が無効になるが
          # ボット PR 自体は作りたい)。
          gh label create auto-collect \
            --description "Bot による自動収集 PR" \
            --color ededed \
            --force 2>/dev/null || true
          file_count=$(git diff --name-only HEAD~1 | wc -l | tr -d ' ')
          gh pr create \
            --title "chore(data): auto-collect articles ${timestamp}" \
            --body "edu-watch-bot による定時自動収集。Sources: 7 RSS feeds. Files touched: ${file_count}." \
            --label "auto-collect" \
            --base main --head "$branch"
          # `gh pr merge --auto` は PR 作成直後で GitHub の status check rollup が
          # 確定していない短い窓に "Pull request is in unstable status" GraphQL
          # エラーで失敗することがある(2026-05-11 22:44 UTC run #25701724642)。
          # 5 秒間隔で最大 3 回リトライし、それでも失敗したら workflow を fail
          # させて再発検知を維持する。
          for attempt in 1 2 3; do
            if gh pr merge --auto --squash --delete-branch "$branch"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "[fetch-news] auto-merge enable failed after 3 attempts" >&2
              exit 1
            fi
            echo "[fetch-news] auto-merge enable retry in 5s (attempt ${attempt})"
            sleep 5
          done
