name: Checks

# 型チェックと textlint が CI に無かった。どちらも `check:all` 経由でしか呼ばれず、
# その `check:all` を実行するワークフローが存在しないため、ローカルで回した時
# だけ効いていた。主コンテンツが週次ダイジェスト(Markdown)であることを考えると、
# textlint が PR で効かないのは穴が大きい。
#
# 既存の check:tokens(e2e.yml)と check:excluded-ids(health-check.yml)は
# 現在の配置のまま動かさない。ここには欠けていた 2 つだけを置く。
#
# **このジョブは required check に入っている**(2026-08-09 に API で実測。
# contexts = ["Playwright E2E", "Persistent denylist consistency",
# "Type and text checks"])。導入時のコメントは「まだ入っていない」のままだったが、
# その後に昇格されており記述が古かった。赤ければマージは機械的に止まる。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type and text checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # astro check は errors でのみ非ゼロ終了する(既定の minimumFailingSeverity=error)。
      # 現在 hints が 27 件あるが落ちない。
      - name: Type check
        run: npm run check

      # textlint の対象は src/content/digests/**/*.md。
      # 片方が落ちても両方の結果が見えるように !cancelled() を付ける
      # (edu-evidence の checks.yml と同じ扱い)。
      - name: Text lint
        if: ${{ !cancelled() }}
        run: npm run check:text

      # W-1 AI 要約の事実確認ゲート(scripts/ai-summary/gate.test.mjs ほか)の
      # 単体テスト。「HIGH 必須 fact 欠落で BLOCK」「全充足で PASS」という
      # ADR 0054 の判定そのものを検証する。
      #
      # パイプライン本体は Ollama(localhost:11434)を要するため CI では回せない
      # が、このテスト群はモデルを呼ばず 0.3 秒で終わる。ゲートが壊れたことに
      # 誰も気づけない状態だったので、ここに載せる。
      - name: AI summary gate tests
        if: ${{ !cancelled() }}
        run: npm run test:ai-summary

      # リセマム / 共同通信 / 教育家庭新聞の NG ワードフィルタ回帰ケース 97 件
      # (ADR 0039 ほか)。判定関数そのものを assert する回帰スイートだが、
      # `check:all` 経由でしか呼ばれず CI に載っていなかったため、フィルタを
      # 壊しても誰も気づけない状態だった。ネットワークを使わず約 5 秒で終わる。
      - name: Source filter regression
        if: ${{ !cancelled() }}
        run: npm run check:filter

      # 同じ理屈が .claude/hooks/ にも要る。frontmatter の不変性ガードと
      # roundtrip 検査は、壊れても例外を出さず素通りするだけなので失敗が見えない。
      # しかもフックは dist に入らないため E2E も VRT も届かず、コンテンツ検査も
      # 「ガードが止めるはずだった改変」の後でしか気づけない。
      # 2026-05-04 の導入以来 CI から一度も呼ばれていなかった。
      - name: Hook regression tests
        if: ${{ !cancelled() }}
        run: npm run test:hooks
