# workflow と dependabot.yml を zizmor で検査する。指摘が 1 件でもあれば(重大度によらず)赤になる。
#
# 手元で zizmor を当てる規範だけでは、当て忘れに誰も気づかない。CI ではトークンがあるので、
# offline では飛ぶ audit(impostor-commit・known-vulnerable-actions・ref-confusion・
# stale-action-refs・ref-version-mismatch)も走る。
#
# .github/ を変える PR でだけ走らせる。そのため advisory の側が増えても、次に .github/ を変える
# PR が来るまでは拾わない。
#
# zizmor の版は action の中のロックで決まる(v0.7.1 は 1.31.1。wheel はハッシュで検証される)ので、
# action を上げると zizmor も上がる。advanced-security: false は、結果を code scanning に上げず、
# 指摘があればこの job を落とすため(true では SARIF を上げるだけで、指摘があっても落ちない)。
# リポの中に zizmor の設定ファイルがあると action はそれを読むので、audit ごと外す設定は置かない。

name: zizmor

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
