# workflow と dependabot.yml を zizmor で検査する。指摘が 1 件でもあれば(重大度によらず)赤になる。
#
# 手元で zizmor を当てる規範だけでは、当て忘れに誰も気づかない。CI ではトークンがあるので、
# offline では飛ぶ audit(impostor-commit・known-vulnerable-actions・ref-confusion・
# stale-action-refs・ref-version-mismatch)も走る。
#
# .github/ を変える PR と、週 1 回(月曜 0:17 UTC)の定期実行で走らせる。定期実行は、workflow を
# 変えていなくても advisory の側が増えたときに拾うため。毎時 0 分は GitHub の遅延・取りこぼしが
# 多いので分をずらす。定期実行が落ちたときの通知は、GitHub の既定(cron を最後に変えた人への
# メール)に任せる。
# public のリポでは 60 日間アクティビティが無いと定期実行が止まる(止まる前にメールが来ることがあるが、Docs には記載が無い)。止まったら Actions から有効にし直す。
#
# zizmor の版は action の中のロックで決まる(version: を渡していないので action の版ごとに固定され、wheel はハッシュで検証される)ので、
# action を上げると zizmor も上がりうる。advanced-security: false は、結果を code scanning に上げず、
# 指摘があればこの job を落とすため(true では SARIF を上げるだけで、指摘があっても落ちない)。
# config: には直前の step で書いた CI 用の空の設定(rules: {})を渡す。zizmor は --config を明示されると
# 他の設定ファイルを探さないので、リポに zizmor.yml などを置いても CI の検査は外れない(空のファイルは
# zizmor が読めずに落ちるので rules: {} を書く)。collect: all は、既定の収集が .gitignore に従うので、
# workflow を .gitignore に書いて検査から外す道を塞ぐため。インラインの zizmor: ignore[...] は効く。

name: zizmor

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write the CI zizmor config
        run: |
          printf 'rules: {}\n' > "$RUNNER_TEMP/zizmor-ci.yml"

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          config: ${{ runner.temp }}/zizmor-ci.yml
          collect: all
