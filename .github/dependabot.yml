version: 2
updates:
  # npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # typescript の major 更新は @astrojs/check の peer dependency
    # (typescript@^5.0.0) と衝突して npm ci が失敗するため除外。
    # @astrojs/check が TypeScript 6 に対応した時点で、この ignore を削除する。
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # astro 7 は vite 8 を必須とする。`@tailwindcss/vite@4.3.3` は vite 8 に対応済みだが、
      # astro 本体が次の vite メジャーを採用するまで vite の major 更新は無視する。
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
    groups:
      astro-ecosystem:
        patterns:
          - "astro"
          - "@astrojs/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      textlint:
        patterns:
          - "textlint"
          - "textlint-*"
      dev-tools:
        patterns:
          - "linkinator"
          - "typescript"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    labels:
      - "dependencies"
    # minor / patch は 1 本の PR にまとめる。別々の PR で同じ日に来ると、先にマージされた
    # 側がワークフローを書き換え、古い main を基にした残りの PR は GITHUB_TOKEN に
    # workflows 権限が無いため GitHub にマージを拒否される(2026-10-12 に発生)。
    # major は auto-merge の対象外なので、個別の PR のまま人が見る。
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
