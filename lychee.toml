# lychee の設定。週次リンクチェック(.github/workflows/link-check.yml)が使う。
#
# ワークフローは --config を渡していない。lychee は既定でカレントディレクトリの
# lychee.toml を読むので、リポジトリ直下に置くだけで効く。チェックの条件そのもの
# (--accept / --exclude / --timeout など)はワークフロー側の args に残してあり、
# ここにはホスト別のレート制限だけを置く。
#
# kyoiku-press.com(日本教育新聞)は、チェック対象のドメインの中で最も多く引用して
# いる(ユニーク 305 本)。lychee の既定(同時 10・最小間隔 50ms)で叩くと、毎回その
# うち数本が 502 を返す — 返る URL は実行のたびに入れ替わり、後から逐次アクセス
# すると全部 200 になる。壊れたリンクは 1 本も無く、1 つの WordPress サイトに
# 集中しすぎているだけだった。この 1 ホストだけ 1 秒に 1 本まで落とす。
#
# 全ホストに掛けない理由は ADR 0065 に書いてある(応答が返らないホストが 1 つ
# 出たときに、直列化した待ち時間が job 全体を道連れにする)。

[hosts."www.kyoiku-press.com"]
concurrency = 1
request_interval = "1s"
